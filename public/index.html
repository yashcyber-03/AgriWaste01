<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriWaste · Smart Agriculture Waste Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>

<section id="auth">
  <div class="hero">
    <div class="logo"><i>🌾</i>AgriWaste</div>
    <div><h1>Turn farm waste into value.</h1><p>Report straw, husk and crop residue, request a pickup, and see it composted, turned into biogas or recycled.</p></div>
    <div class="stats-strip"><div><b>6</b>waste categories</div><div><b>4</b>recycling routes</div><div><b>Live</b>pickup tracking</div></div>
    <svg viewBox="0 0 200 200" fill="#fff"><path d="M100 10c30 30 30 70 0 100-30-30-30-70 0-100zM40 60c35 5 55 35 50 70-35-5-55-35-50-70zM160 60c-35 5-55 35-50 70 35-5 55-35 50-70zM96 110h8v90h-8z"/></svg>
  </div>
  <div class="formwrap"><div class="formbox">
    <h2>Welcome back</h2><div class="tabs"><button id="tLogin" class="on">Sign in</button><button id="tReg">Create account</button></div>
    <form id="authForm">
      <div id="regOnly" class="hide"><div class="field"><label for="name">Full name</label><input id="name"></div>
      <div class="row"><div class="field"><label for="phone">Phone</label><input id="phone"></div><div class="field"><label for="role">I am a</label><select id="role"><option value="farmer">Farmer</option><option value="worker">Collection worker</option></select></div></div></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6"></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" style="width:100%" id="authBtn">Sign in</button>
    </form>
    <div class="demo"><p>Try it now with a demo account</p><div>
      <button class="btn alt sm" data-demo="farmer@demo.com">Farmer</button><button class="btn alt sm" data-demo="worker@demo.com">Collection worker</button><button class="btn alt sm" data-demo="admin@demo.com">Admin</button></div></div>
  </div></div>
</section>

<div id="app" class="hide">
  <aside><div class="logo"><i>🌾</i>AgriWaste</div><nav id="nav" style="display:contents"></nav>
    <div class="me"><b id="meName"></b><small id="meRole"></small><button class="btn alt sm" id="logout" style="margin-top:.6rem">Sign out</button></div></aside>
  <main><div class="top"><div><h2 id="title"></h2><p id="sub"></p></div><button class="btn alt bell" id="bell">🔔 Notifications<b id="badge" class="hide"></b></button></div>
    <div id="notes" class="card hide"></div><div id="view"></div></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="app.js"></script></body></html>
